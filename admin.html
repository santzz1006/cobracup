<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobra Cup - Painel Admin Visual</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10b981', 
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .match-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            text-align: left;
            font-weight: 700;
            color: #1e293b;
        }
        .match-input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }
        .score-input {
            width: 24px;
            text-align: center;
            background: #f1f5f9;
            border-radius: 4px;
            border: 1px solid transparent;
            outline: none;
            font-weight: 800;
        }
        .score-input:focus {
            border-color: #cbd5e1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-900 text-white rounded-lg flex items-center justify-center shadow-md">
                <i data-lucide="shield-alert" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-900">Admin do Chaveamento</h1>
                <p class="text-xs text-slate-500 font-medium">Edite os nomes e placares livremente</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="initializeBracket()" id="btn-init" class="hidden bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold py-2 px-4 rounded-lg shadow-sm transition-all items-center gap-2">
                <i data-lucide="sparkles" class="w-4 h-4"></i> Criar 15 Partidas Vazias
            </button>
            <button onclick="saveAllMatches()" id="btn-save" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-all flex items-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i> Salvar Todas as Alterações
            </button>
        </div>
    </header>

    <div class="flex-1 overflow-auto p-4 md:p-8 bg-slate-100 relative">
        <div id="bracket-container" class="flex justify-between w-full max-w-[1200px] min-w-[900px] mx-auto min-h-[500px]">
            <!-- Bracket will be injected here -->
            <div class="w-full h-full flex items-center justify-center text-slate-500 font-medium">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin"></i>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i data-lucide="check-circle" class="text-green-400 w-5 h-5"></i>
        <span id="toast-message" class="font-medium text-sm">Salvo com sucesso!</span>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://uodjtrnbaykkbandcwju.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZGp0cm5iYXlra2JhbmRjd2p1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTYxNDksImV4cCI6MjEwMDg3MjE0OX0.Ajq_iyVaRVgjuz_QvM7RhKQId3bs6DmiXm-QfBmSwys';
        
        // Usamos a chave pública e aproveitamos a sessão já logada do index.html
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let matchesData = [];

        async function loadMatches() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                const container = document.getElementById('bracket-container');
                container.innerHTML = `<div class="w-full flex flex-col items-center justify-center text-red-500 font-bold p-8 bg-white rounded-xl shadow-sm border border-red-200">
                    <i data-lucide="lock" class="w-8 h-8 mb-3"></i>
                    <p class="text-center">Você precisa estar logado para acessar o painel de admin.</p>
                    <p class="text-center text-sm font-medium mt-2">Por favor, faça login no site principal e recarregue esta página.</p>
                </div>`;
                lucide.createIcons();
                return;
            }
            const { data: matches, error } = await supabaseClient
                .from('matches')
                .select('*')
                .order('created_at', { ascending: true })
                .order('id', { ascending: true });

            if (error) {
                alert("Erro ao carregar: " + error.message);
                return;
            }

            matchesData = matches || [];
            renderVisualBracket();
        }

        function renderVisualBracket() {
            const container = document.getElementById('bracket-container');
            const btnInit = document.getElementById('btn-init');
            
            if (matchesData.length !== 15) {
                container.innerHTML = `<div class="w-full flex flex-col items-center justify-center text-slate-500 font-medium p-8 bg-white rounded-xl shadow-sm border border-slate-200">
                    <p class="mb-2 text-center text-lg text-slate-800 font-bold">Quase lá!</p>
                    <p class="mb-4 text-center">Para o chaveamento visual funcionar, o banco precisa ter a estrutura de 15 partidas (Oitavas até a Final).</p>
                    <p class="text-center mb-6">Você já tem <b>${matchesData.length}</b> partidas cadastradas. Clique no botão acima para adicionar automaticamente as <b>${15 - matchesData.length}</b> partidas em branco que faltam sem apagar as suas atuais.</p>
                </div>`;
                btnInit.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i> Completar Chaveamento (+${15 - matchesData.length} vazias)`;
                btnInit.classList.remove('hidden');
                btnInit.classList.add('flex');
                return;
            }
            
            btnInit.classList.add('hidden');
            btnInit.classList.remove('flex');

            const nextNodeMap = {
                0: { next: 8, slot: 1 }, 1: { next: 8, slot: 2 },
                2: { next: 9, slot: 1 }, 3: { next: 9, slot: 2 },
                4: { next: 10, slot: 1 }, 5: { next: 10, slot: 2 },
                6: { next: 11, slot: 1 }, 7: { next: 11, slot: 2 },
                8: { next: 12, slot: 1 }, 9: { next: 12, slot: 2 },
                10: { next: 13, slot: 1 }, 11: { next: 13, slot: 2 },
                12: { next: 14, slot: 1 }, 13: { next: 14, slot: 2 }
            };

            const generateInputHTML = (m, idx) => {
                const btn1 = nextNodeMap[idx] ? `<button type="button" onclick="advancePlayer(${idx}, 1)" class="ml-2 text-brand-600 hover:text-brand-800 transition-colors" title="Avançar"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>` : '';
                const btn2 = nextNodeMap[idx] ? `<button type="button" onclick="advancePlayer(${idx}, 2)" class="ml-2 text-brand-600 hover:text-brand-800 transition-colors" title="Avançar"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>` : '';

                return `
                    <div class="match-box relative" data-id="${m.id}" id="match-${idx}">
                        <div class="match-player flex items-center justify-between">
                            <input type="text" class="match-input p1-name flex-1" value="${m.player1_name || ''}" placeholder="Vazio">
                            <div class="flex items-center shrink-0">
                                <input type="number" class="score-input p1-score" value="${m.score_p1 !== null ? m.score_p1 : ''}" placeholder="-">
                                ${btn1}
                            </div>
                        </div>
                        <div class="match-player flex items-center justify-between">
                            <input type="text" class="match-input p2-name flex-1" value="${m.player2_name || ''}" placeholder="Vazio">
                            <div class="flex items-center shrink-0">
                                <input type="number" class="score-input p2-score" value="${m.score_p2 !== null ? m.score_p2 : ''}" placeholder="-">
                                ${btn2}
                            </div>
                        </div>
                    </div>
                `;
            };

            container.innerHTML = `
                <!-- Left Side: Oitavas -->
                <div class="bracket-round relative">
                    <div class="absolute -top-8 w-full text-center text-slate-400 font-bold text-[10px] tracking-widest uppercase">Oitavas</div>
                    ${generateInputHTML(matchesData[0], 0)}
                    ${generateInputHTML(matchesData[1], 1)}
                    ${generateInputHTML(matchesData[2], 2)}
                    ${generateInputHTML(matchesData[3], 3)}
                </div>
                
                <!-- Left Side: Quartas -->
                <div class="bracket-round relative">
                    <div class="absolute -top-8 w-full text-center text-slate-400 font-bold text-[10px] tracking-widest uppercase">Quartas</div>
                    ${generateInputHTML(matchesData[8], 8)}
                    ${generateInputHTML(matchesData[9], 9)}
                </div>
                
                <!-- Left Side: Semifinal -->
                <div class="bracket-round relative">
                    <div class="absolute -top-8 w-full text-center text-slate-400 font-bold text-[10px] tracking-widest uppercase">Semifinal</div>
                    ${generateInputHTML(matchesData[12], 12)}
                </div>
                
                <!-- Center: FINAL -->
                <div class="bracket-round items-center justify-center px-2 relative min-w-[180px]">
                    <div class="flex flex-col items-center justify-center relative w-full gap-4">
                        <span class="px-5 py-2 bg-amber-100 text-amber-700 font-black text-sm rounded-xl shadow-sm border border-amber-200 z-10 flex items-center gap-2">
                            <i data-lucide="crown" class="w-4 h-4"></i> FINAL
                        </span>
                        ${generateInputHTML(matchesData[14], 14)}
                        
                        <div class="flex flex-col items-center justify-center w-full mt-4 pointer-events-none">
                            <img src="efootball-logo-1.png" alt="eFootball Logo" class="h-24 object-contain opacity-80" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
                
                <!-- Right Side: Semifinal -->
                <div class="bracket-round relative">
                    <div class="absolute -top-8 w-full text-center text-slate-400 font-bold text-[10px] tracking-widest uppercase">Semifinal</div>
                    ${generateInputHTML(matchesData[13], 13)}
                </div>
                
                <!-- Right Side: Quartas -->
                <div class="bracket-round relative">
                    <div class="absolute -top-8 w-full text-center text-slate-400 font-bold text-[10px] tracking-widest uppercase">Quartas</div>
                    ${generateInputHTML(matchesData[10], 10)}
                    ${generateInputHTML(matchesData[11], 11)}
                </div>
                
                <!-- Right Side: Oitavas -->
                <div class="bracket-round relative">
                    <div class="absolute -top-8 w-full text-center text-slate-400 font-bold text-[10px] tracking-widest uppercase">Oitavas</div>
                    ${generateInputHTML(matchesData[4], 4)}
                    ${generateInputHTML(matchesData[5], 5)}
                    ${generateInputHTML(matchesData[6], 6)}
                    ${generateInputHTML(matchesData[7], 7)}
                </div>
            `;
            lucide.createIcons();
        }

        async function advancePlayer(sourceIndex, sourcePlayer) {
            const nextNodeMap = {
                0: { next: 8, slot: 1 }, 1: { next: 8, slot: 2 },
                2: { next: 9, slot: 1 }, 3: { next: 9, slot: 2 },
                4: { next: 10, slot: 1 }, 5: { next: 10, slot: 2 },
                6: { next: 11, slot: 1 }, 7: { next: 11, slot: 2 },
                8: { next: 12, slot: 1 }, 9: { next: 12, slot: 2 },
                10: { next: 13, slot: 1 }, 11: { next: 13, slot: 2 },
                12: { next: 14, slot: 1 }, 13: { next: 14, slot: 2 }
            };
            
            const map = nextNodeMap[sourceIndex];
            if (!map) return;
            
            const sourceBox = document.getElementById(`match-${sourceIndex}`);
            const targetBox = document.getElementById(`match-${map.next}`);
            
            if(!sourceBox || !targetBox) return;
            
            const name = sourceBox.querySelector(sourcePlayer === 1 ? '.p1-name' : '.p2-name').value;
            const matchId = sourceBox.getAttribute('data-id');
            
            if (!name) {
                alert("O nome do jogador está vazio!");
                return;
            }

            // Animação de Avanço (Visual)
            const targetInput = targetBox.querySelector(map.slot === 1 ? '.p1-name' : '.p2-name');
            targetInput.style.transition = 'background-color 0.3s ease';
            targetInput.style.backgroundColor = '#d1fae5'; 
            setTimeout(() => { targetInput.style.backgroundColor = 'transparent'; }, 600);

            // Abrir Modal de Estatísticas em vez de dar só confirm()
            const p1Name = sourceBox.querySelector('.p1-name')?.value || 'Jogador 1';
            const p2Name = sourceBox.querySelector('.p2-name')?.value || 'Jogador 2';
            const p1ScoreEl = sourceBox.querySelector('.p1-score');
            const p2ScoreEl = sourceBox.querySelector('.p2-score');
            const p1Score = p1ScoreEl ? p1ScoreEl.value : 0;
            const p2Score = p2ScoreEl ? p2ScoreEl.value : 0;

            document.getElementById('stats-match-id').value = matchId;
            document.getElementById('stats-winner-name').value = name;
            document.getElementById('stats-source-index').value = sourceIndex;
            document.getElementById('stats-target-index').value = map.next;
            document.getElementById('stats-target-slot').value = map.slot;

            document.getElementById('stats-p1-label').innerText = p1Name;
            document.getElementById('stats-p2-label').innerText = p2Name;
            document.getElementById('stats-p1-score').value = p1Score;
            document.getElementById('stats-p2-score').value = p2Score;
            document.getElementById('stats-p1-passes').value = '';
            document.getElementById('stats-p2-passes').value = '';
            document.getElementById('stats-p1-shots').value = '';
            document.getElementById('stats-p2-shots').value = '';

            const modal = document.getElementById('stats-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeStatsModal() {
            const modal = document.getElementById('stats-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function confirmResolveMatch() {
            const matchId = document.getElementById('stats-match-id').value;
            const winnerName = document.getElementById('stats-winner-name').value;
            const sourceIndex = document.getElementById('stats-source-index').value;
            const targetIndex = document.getElementById('stats-target-index').value;
            const targetSlot = document.getElementById('stats-target-slot').value;

            const p1Score = parseInt(document.getElementById('stats-p1-score').value) || 0;
            const p2Score = parseInt(document.getElementById('stats-p2-score').value) || 0;
            const p1Passes = parseInt(document.getElementById('stats-p1-passes').value) || 0;
            const p2Passes = parseInt(document.getElementById('stats-p2-passes').value) || 0;
            const p1Shots = parseInt(document.getElementById('stats-p1-shots').value) || 0;
            const p2Shots = parseInt(document.getElementById('stats-p2-shots').value) || 0;

            // Avança o nome fisicamente para a próxima caixa
            const targetBox = document.getElementById(`match-${targetIndex}`);
            const targetInput = targetBox.querySelector(targetSlot == 1 ? '.p1-name' : '.p2-name');
            targetInput.value = winnerName;

            closeStatsModal();

            try {
                // 1. Fechar a partida no banco COM ESTATÍSTICAS
                const { error: matchError } = await supabaseClient.from('matches').update({ 
                    status: 'finished', 
                    winner: winnerName,
                    score_p1: p1Score,
                    score_p2: p2Score,
                    passes_p1: p1Passes,
                    passes_p2: p2Passes,
                    shots_p1: p1Shots,
                    shots_p2: p2Shots
                }).eq('id', matchId);
                
                if (matchError) throw matchError;
                    
                    // 2. Buscar todas as apostas simples pendentes para essa partida
                    const { data: bets, error: betFetchError } = await supabaseClient.from('bets')
                        .select('*')
                        .eq('match_id', matchId)
                        .eq('status', 'pending');
                    
                    if (betFetchError) throw betFetchError;

                    let payoutCount = 0;
                    
                    // 3. Processar cada aposta
                    if (bets && bets.length > 0) {
                        for (let bet of bets) {
                            if (bet.predicted_winner === winnerName) {
                                const profit = bet.amount * 2;
                                const { error: rpcError } = await supabaseClient.rpc('update_user_balance', { p_user_id: bet.user_id, p_amount: profit });
                                if (rpcError) throw rpcError;

                                const { error: wonError } = await supabaseClient.from('bets').update({ status: 'won' }).eq('id', bet.id);
                                if (wonError) throw wonError;
                                payoutCount++;
                            } else {
                                const { error: lostError } = await supabaseClient.from('bets').update({ status: 'lost' }).eq('id', bet.id);
                                if (lostError) throw lostError;
                            }
                        }
                    }
                    
                    alert(`Partida encerrada com sucesso! ${payoutCount} aposta(s) vencedora(s) foram pagas.`);
                    
                    // Salvar também o nome na nova fase automaticamente
                    await saveAllMatches();
                    
                } catch (err) {
                    alert("⚠️ ERRO: O banco bloqueou a ação. Motivo: " + err.message);
                }
        }

        async function initializeBracket() {
            const btnInit = document.getElementById('btn-init');
            btnInit.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Completando...';
            lucide.createIcons();
            
            const missingCount = 15 - matchesData.length;
            
            if (missingCount > 0) {
                const emptyMatches = Array.from({length: missingCount}).map(() => ({
                    player1_name: '',
                    player2_name: '',
                    score_p1: null,
                    score_p2: null
                }));

                const { error } = await supabaseClient.from('matches').insert(emptyMatches);
                
                if(error) {
                    alert("Erro ao criar: " + error.message);
                    btnInit.innerHTML = 'Tentar Novamente';
                    return;
                }
            }
            
            await loadMatches();
        }

        async function saveAllMatches() {
            const btn = document.getElementById('btn-save');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Salvando...';
            lucide.createIcons();
            btn.disabled = true;

            const boxes = document.querySelectorAll('.match-box');
            let updates = [];

            boxes.forEach(box => {
                const id = box.getAttribute('data-id');
                const n1 = box.querySelector('.p1-name')?.value || '';
                const n2 = box.querySelector('.p2-name')?.value || '';
                const s1El = box.querySelector('.p1-score');
                const s2El = box.querySelector('.p2-score');
                const s1 = s1El ? s1El.value : '';
                const s2 = s2El ? s2El.value : '';

                updates.push({
                    id: id,
                    player1_name: n1,
                    player2_name: n2,
                    score_p1: s1 === '' ? null : parseInt(s1),
                    score_p2: s2 === '' ? null : parseInt(s2)
                });
            });

            // Upsert in Supabase (updates multiple rows at once if IDs match)
            const { error } = await supabaseClient
                .from('matches')
                .upsert(updates);

            btn.disabled = false;
            btn.innerHTML = originalHtml;
            lucide.createIcons();

            if (error) {
                alert("Erro ao salvar: " + error.message);
            } else {
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        loadMatches();
    </script>
</body>
</html>
